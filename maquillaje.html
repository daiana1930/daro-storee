  <title>Maquillaje — DaRo Store</title>

    .volver { display: inline-block; margin-bottom: 20px; color: #b74a7c; text-decoration: none; font-size: 15px; }

    .producto img { border-radius: 8px; max-width: 160px; margin-bottom: 10px; }
    .nombre { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 4px; }
    .descripcion { font-size: 15px; color: #666; margin-bottom: 8px; }
    .precio { font-size: 17px; font-weight: bold; color: #2a9134; }

</head>
