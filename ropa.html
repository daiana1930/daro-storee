<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ropa — DaRo Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { max-width: 600px; margin: 0 auto; padding: 20px; background: #fefefe; }
    .volver { display: inline-block; margin-bottom: 20px; color: #b74a7c; text-decoration: none; font-size: 15px; }
    .volver:hover { text-decoration: underline; }
    h2 { color: #b74a7c; margin-bottom: 25px; text-align: center; }
    .producto { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .producto img { border-radius: 8px; max-width: 160px; margin-bottom: 10px; }
    .nombre { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 4px; }
    .descripcion { font-size: 15px; color: #666; margin-bottom: 8px; }
    .precio { font-size: 17px; font-weight: bold; color: #2a9134; }
  </style>
</head>
<body>

  <a href="index.html" class="volver">← Volver al inicio</a>

  <h2>👗 Ropa</h2>

  <div class="producto">
    <div class="nombre">Prendas Variadas</div>
    <div class="descripcion">Consulta talles, modelos y disponibilidad</div>
    <div class="precio">📩 Consultar por WhatsApp</div>
  </div>

</body>
</html>
